# Golden questions. Expected figures come from the seeded data and the calculators
# (computed by calling the pack functions directly, not by an LLM).
#
# Checks on the final answer:
#   numbers: every number must appear (Indian or plain format, +/- 1 rupee)
#   words:   every word or phrase must appear (case-insensitive); "a|b" means either
#   not:     none of these may appear
#   action:  this action must be proposed (confirmation card raised)
# `turns` runs earlier messages first in the same session; checks apply to the last.

